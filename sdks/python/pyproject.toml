[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmasterhub-sdk"
version = "0.1.0"
description = "Python client for the OpenMasterHub local API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[tool.hatch.build.targets.wheel]
packages = ["openmasterhub"]
