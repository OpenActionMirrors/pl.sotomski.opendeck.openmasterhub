<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="inspector.css" />
  </head>
  <body>
    <h1>Set LED color</h1>
    <fieldset>
      <legend>Target</legend>
      <div class="targets">
        <label><input type="checkbox" name="target" value="base" checked /> Base</label>
        <label><input type="checkbox" name="target" value="top" checked /> Top knob</label>
        <label><input type="checkbox" name="target" value="left" checked /> Left knob</label>
        <label><input type="checkbox" name="target" value="right" checked /> Right knob</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Color</legend>
      <input id="color" type="color" value="#ff0000" />
      <label class="slider">
        <span>Hue</span>
        <input id="h" class="spectrum" type="range" min="0" max="360" value="0" />
        <output id="h-out"></output>
      </label>
      <label class="slider">
        <span>Saturation</span>
        <input id="s" class="spectrum" type="range" min="0" max="100" value="100" />
        <output id="s-out"></output>
      </label>
      <label class="slider">
        <span>Brightness</span>
        <input id="v" class="spectrum" type="range" min="0" max="100" value="100" />
        <output id="v-out"></output>
      </label>
    </fieldset>
    <script>
      const boxes = [...document.querySelectorAll('input[name="target"]')];
      const h = document.getElementById("h");
      const s = document.getElementById("s");
      const v = document.getElementById("v");
      const color = document.getElementById("color");
      let socket = null;
      let context = null;

      function hsvToRgb(hue, saturation, value) {
        const hh = ((hue % 360) + 360) % 360;
        const ss = Math.min(100, Math.max(0, saturation)) / 100;
        const vv = Math.min(100, Math.max(0, value)) / 100;
        const c = vv * ss;
        const hp = hh / 60;
        const x = c * (1 - Math.abs((hp % 2) - 1));
        let r = 0;
        let g = 0;
        let b = 0;
        if (hp < 1) [r, g, b] = [c, x, 0];
        else if (hp < 2) [r, g, b] = [x, c, 0];
        else if (hp < 3) [r, g, b] = [0, c, x];
        else if (hp < 4) [r, g, b] = [0, x, c];
        else if (hp < 5) [r, g, b] = [x, 0, c];
        else [r, g, b] = [c, 0, x];
        const m = vv - c;
        return [r, g, b].map((channel) => Math.round((channel + m) * 255));
      }

      function rgbToHsv(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const d = max - min;
        let hue = 0;
        if (d !== 0) {
          if (max === r) hue = ((g - b) / d) % 6;
          else if (max === g) hue = (b - r) / d + 2;
          else hue = (r - g) / d + 4;
          hue *= 60;
          if (hue < 0) hue += 360;
        }
        return [hue, max === 0 ? 0 : (d / max) * 100, max * 100];
      }

      function hslToHsv(hue, saturation, lightness) {
        const ss = saturation / 100;
        const ll = lightness / 100;
        const value = ll + ss * Math.min(ll, 1 - ll);
        const sv = value === 0 ? 0 : 2 * (1 - ll / value);
        return [hue, sv * 100, value * 100];
      }

      function hex(rgb) {
        return (
          "#" + rgb.map((channel) => channel.toString(16).padStart(2, "0")).join("")
        );
      }

      function paint() {
        const rgb = hsvToRgb(Number(h.value), Number(s.value), Number(v.value));
        const pure = hex(hsvToRgb(Number(h.value), 100, 100));
        document.getElementById("h-out").textContent = `${h.value}°`;
        document.getElementById("s-out").textContent = `${s.value}%`;
        document.getElementById("v-out").textContent = `${v.value}%`;
        s.style.background = `linear-gradient(90deg, #ffffff, ${pure})`;
        v.style.background = `linear-gradient(90deg, #000000, ${pure})`;
        color.value = hex(rgb);
      }

      function persist() {
        paint();
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            event: "setSettings",
            context,
            payload: {
              targets: boxes.filter((box) => box.checked).map((box) => box.value),
              h: Number(h.value),
              s: Number(s.value),
              v: Number(v.value),
            },
          }),
        );
      }

      function fromPicker() {
        const value = color.value;
        const [hue, saturation, brightness] = rgbToHsv(
          parseInt(value.slice(1, 3), 16),
          parseInt(value.slice(3, 5), 16),
          parseInt(value.slice(5, 7), 16),
        );
        h.value = String(Math.round(hue));
        s.value = String(Math.round(saturation));
        v.value = String(Math.round(brightness));
        persist();
      }

      for (const input of [...boxes, h, s, v]) input.addEventListener("input", persist);
      color.addEventListener("input", fromPicker);
      paint();

      function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
        inActionInfo = JSON.parse(inActionInfo);
        context = inActionInfo.context;
        const settings = inActionInfo.payload.settings ?? {};
        const targets = Array.isArray(settings.targets)
          ? settings.targets
          : ["base", "top", "left", "right"];
        for (const box of boxes) box.checked = targets.includes(box.value);
        if (Number.isFinite(settings.v)) {
          h.value = settings.h ?? 0;
          s.value = settings.s ?? 100;
          v.value = settings.v;
        } else if (Number.isFinite(settings.l)) {
          const [hue, saturation, brightness] = hslToHsv(
            settings.h ?? 0,
            settings.s ?? 100,
            settings.l,
          );
          h.value = String(Math.round(hue));
          s.value = String(Math.round(saturation));
          v.value = String(Math.round(brightness));
        } else {
          h.value = settings.h ?? 0;
          s.value = settings.s ?? 100;
          v.value = 100;
        }
        paint();

        socket = new WebSocket("ws://127.0.0.1:" + inPort);
        socket.onopen = () => {
          socket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
          persist();
        };
      }
    </script>
  </body>
</html>
