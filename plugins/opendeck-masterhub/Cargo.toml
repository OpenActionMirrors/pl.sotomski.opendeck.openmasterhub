[package]
name = "opendeck-masterhub"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "OpenDeck device plugin for the MasterHub"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
masterhubd = { path = "../../daemons/masterhubd" }
openaction = "1.1.5"
serde_json = "1"
simplelog = "0.12"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
masterhubd = { path = "../../daemons/masterhubd" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
