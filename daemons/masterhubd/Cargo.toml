[package]
name = "masterhubd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
description = "USB HID daemon for the Master Hub"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
# linux-native-basic-udev talks to hidraw without libudev, so a Linux build
# does not need libudev.so and can be cross-compiled.
hidapi = { version = "2.6.6", default-features = false, features = ["macos-shared-device", "linux-native-basic-udev"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
